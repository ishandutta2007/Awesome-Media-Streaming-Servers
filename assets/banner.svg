<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRose" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 52px;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 20px;
        font-weight: 500;
        fill: #94a3b8;
        letter-spacing: 0.5px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.2px;
      }
      
      /* Subtle animations for dynamic streaming feel */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.04); }
      }
      @keyframes floatBeam {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(1300px); }
      }
      @keyframes waveBar {
        0%, 100% { height: 18px; y: 310px; }
        50% { height: 42px; y: 286px; }
      }
      @keyframes waveBar2 {
        0%, 100% { height: 35px; y: 293px; }
        50% { height: 16px; y: 312px; }
      }
      @keyframes waveBar3 {
        0%, 100% { height: 26px; y: 302px; }
        50% { height: 48px; y: 280px; }
      }
      @keyframes liveBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      .pulse-bg {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: center;
      }
      .live-dot {
        animation: liveBlink 1.8s ease-in-out infinite;
      }
      .eq-bar-1 { animation: waveBar 1.2s ease-in-out infinite; }
      .eq-bar-2 { animation: waveBar2 0.9s ease-in-out infinite; }
      .eq-bar-3 { animation: waveBar3 1.4s ease-in-out infinite; }
      .eq-bar-4 { animation: waveBar 0.8s ease-in-out infinite; }
      .eq-bar-5 { animation: waveBar2 1.1s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <rect width="1200" height="400" fill="url(#techGrid)" />

  <!-- Dynamic Glowing Ambiance in Background -->
  <rect width="1200" height="400" fill="url(#glowPurple)" class="pulse-bg" />
  <rect width="1200" height="400" fill="url(#glowCyan)" class="pulse-bg" />
  <rect width="1200" height="400" fill="url(#glowRose)" />

  <!-- Flowing Dynamic Light Streams (In background, well beneath text) -->
  <g opacity="0.4">
    <path d="M -100,120 Q 300,50 600,140 T 1300,100" fill="none" stroke="url(#titleGrad)" stroke-width="2" stroke-opacity="0.3" />
    <path d="M -100,280 Q 400,340 800,260 T 1300,320" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.25" />
    <path d="M -50,350 Q 500,290 900,360 T 1350,310" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2" />
  </g>

  <!-- Visual Audio / Stream Equalizer Bars at Bottom-Right (Dynamic) -->
  <g opacity="0.75" transform="translate(980, 0)">
    <rect class="eq-bar-1" x="0" width="6" rx="3" fill="#38bdf8" />
    <rect class="eq-bar-2" x="14" width="6" rx="3" fill="#818cf8" />
    <rect class="eq-bar-3" x="28" width="6" rx="3" fill="#c084fc" />
    <rect class="eq-bar-4" x="42" width="6" rx="3" fill="#f472b6" />
    <rect class="eq-bar-5" x="56" width="6" rx="3" fill="#38bdf8" />
    <rect class="eq-bar-2" x="70" width="6" rx="3" fill="#818cf8" />
    <rect class="eq-bar-1" x="84" width="6" rx="3" fill="#06b6d4" />
  </g>

  <!-- Top "LIVE STREAMING INFRASTRUCTURE" Pill -->
  <g transform="translate(80, 48)">
    <rect width="270" height="34" rx="17" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="20" cy="17" r="5" fill="#ef4444" class="live-dot" />
    <text x="36" y="22" fill="#38bdf8" class="pill-text">MEDIA STREAMING ECOSYSTEM</text>
  </g>

  <!-- Protocol Feature Badges in Foreground Top-Right -->
  <g transform="translate(720, 52)" opacity="0.9">
    <rect x="0" y="0" width="76" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="38" y="17" fill="#38bdf8" font-size="11" font-family="sans-serif" font-weight="700" text-anchor="middle">WebRTC</text>

    <rect x="86" y="0" width="62" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="117" y="17" fill="#818cf8" font-size="11" font-family="sans-serif" font-weight="700" text-anchor="middle">HLS</text>

    <rect x="158" y="0" width="68" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="192" y="17" fill="#c084fc" font-size="11" font-family="sans-serif" font-weight="700" text-anchor="middle">RTMP</text>

    <rect x="236" y="0" width="60" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="266" y="17" fill="#f472b6" font-size="11" font-family="sans-serif" font-weight="700" text-anchor="middle">SRT</text>

    <rect x="306" y="0" width="70" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="341" y="17" fill="#34d399" font-size="11" font-family="sans-serif" font-weight="700" text-anchor="middle">DASH</text>
  </g>

  <!-- FOREGROUND: Main Title -->
  <g transform="translate(80, 155)">
    <text class="title-text" fill="url(#titleGrad)">Awesome Media Streaming Servers</text>
  </g>

  <!-- FOREGROUND: Subtitle & Description -->
  <g transform="translate(80, 205)">
    <text class="subtitle-text">Curated Self-Hosted Video Engines, Real-Time Media Routers &amp; Cloud Streaming SaaS</text>
  </g>

  <!-- Subtitle Tagline Chips (Pills in lower foreground) -->
  <g transform="translate(80, 252)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="168" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="18" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">⚡ Ultra-Low Latency</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="162" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="198" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🏠 Home Media Hubs</text>

    <!-- Pill 3 -->
    <rect x="354" y="0" width="176" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="372" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🌐 Distributed Routing</text>

    <!-- Pill 4 -->
    <rect x="542" y="0" width="182" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="560" y="20" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🛡️ 100% Open-Source</text>
  </g>

  <!-- Subtle Bottom Border Accent Line -->
  <line x1="80" y1="360" x2="1120" y2="360" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
  <line x1="80" y1="360" x2="380" y2="360" stroke="url(#titleGrad)" stroke-width="2" />
</svg>
